services:
  authmesh:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: authmesh-gateway
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - NODE_ENV=production
    volumes:
      - authmesh-data:/app/server/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  authmesh-data:
