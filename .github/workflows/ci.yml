name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-verify:
    name: Build, Lint & Automated Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript type-check and lint
        run: npm run lint

      - name: Execute automated test suite (Unit & Integration)
        run: npm test

      - name: Build client and server bundles
        run: npm run build

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build container image
        run: docker build -t authmesh:ci .
      - name: Run the container and check the UI
        run: |
          docker run -d --name authmesh -p 127.0.0.1:4000:4000 authmesh:ci
          ok=0
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4000/ -o index.html; then ok=1; break; fi
            sleep 2
          done
          test "$ok" = "1"
          grep -qi '<div id="root"' index.html
          healthy=0
          for p in /health /api/health /healthz; do
            if curl -fsS http://127.0.0.1:4000$p > /dev/null; then echo "health ok at $p"; healthy=1; break; fi
          done
          test "$healthy" = "1"
      - name: Container logs
        if: always()
        run: docker logs authmesh || true
